name: Monitor Zhangjiang tenders

on:
  # Temporary test hook; removed automatically after the test is verified.
  push:
    paths:
      - "monitor.py"
  schedule:
    # 09:00 China Standard Time (UTC+8)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boc-tender-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK || secrets.WECOM_WEBHOOK_URL }}
      TARGET_KEYWORDS: 张江,张江园区
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check announcements and notify WeCom
        run: python monitor.py

      - name: Save processed announcement IDs
        if: success()
        run: |
          if test -z "$(git status --porcelain -- data/seen.json)"; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git commit -m "chore: update tender monitor state"
          git push
