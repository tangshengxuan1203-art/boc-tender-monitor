name: Daily BOC tender monitor

on:
  # Daily at 10:30 Asia/Shanghai (02:30 UTC); actual execution may be delayed.
  schedule:
    - cron: '30 2 * * *'
  # Compatibility entry point for an external scheduler; its status is unverified.
  push:
    branches: [main]
    paths: [data/automation-trigger.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boc-tender-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK || secrets.WECOM_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: python monitor.py
      - name: Save processed announcement IDs
        if: success()
        run: |
          if test -z "$(git status --porcelain -- data/seen.json)"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git commit -m "chore: update tender monitor state"
          git pull --rebase origin main
          git push
