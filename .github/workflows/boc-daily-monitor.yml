name: Daily BOC tender monitor

on:
  # Start before the busy whole-hour queue, then wait until 10:00 China time.
  schedule:
    - cron: "57 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boc-tender-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK || secrets.WECOM_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Wait until 10:00 China time
        run: |
          target=$(date -u -d "today 02:00:00" +%s)
          now=$(date -u +%s)
          if [ "$target" -gt "$now" ]; then sleep $((target - now)); fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: python monitor.py
      - name: Save processed announcement IDs
        if: success()
        run: |
          if test -z "$(git status --porcelain -- data/seen.json)"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/seen.json
          git commit -m "chore: update tender monitor state"
          git push
